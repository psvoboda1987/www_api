<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Palindrome validator</title>
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
</head>
<body>
<div class="container">
    <h2>Palindrome validator</h2>
    <label for="palindrome">Palindrome</label>
    <input type="text" name="palindrome" id="palindrome">
    <div id="result"></div>
</div>
<script>
    const result = document.getElementById('result');
    const palindrome = document.getElementById('palindrome');
    handleValidator(palindrome.value, result);
    window.addEventListener('keyup', e => {
        handleValidator(palindrome.value, result);
    })

    function handleValidator(palindrome) {
        if (palindrome === '') {
            result.textContent = '';
            return;
        }
        if (isPalindrome(String(palindrome)) === true) {
            result.textContent = 'palindrome';
            result.style.color = 'green';
            return;
        }
        result.textContent = 'not palindrome';
        result.style.color = 'red';
    }

    function isPalindrome(word) {
        return word === word.split('').reverse().join('');
    }
</script>
</body>
</html>
