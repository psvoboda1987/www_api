<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Birthday Number Validator</title>
    <link rel="stylesheet" href="assets/css/core.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
</head>
<body>
<div class="container">
    <h2>Birthday number validator</h2>
    <label for="pin">Birthday number</label>
    <input type="text" name="pin" id="pin">
    <div id="result"></div>
</div>
<script>
    const result = document.getElementById('result');
    const pin = document.getElementById('pin');
    handleValidator(pin.value, result);
    window.addEventListener('keyup', e => {
        handleValidator(pin.value, result);
    })

    function handleValidator(pin) {
        if (pin === '') {
            result.textContent = '';
            return;
        }
        if (validateBirthNumber(String(pin)) === true) {
            result.textContent = 'valid';
            result.style.color = 'green';
            return;
        }
        result.textContent = 'not valid';
        result.style.color = 'red';
    }

    function validateBirthNumber(pin) {
        if (pin.length > 10) {
            return false;
        }
        let matches = pin.match(/(\d\d)(\d\d)(\d\d)[ /]*(\d\d\d)(\d?)/);
        if (matches === null) {
            return false;
        }
        let [, year, month, day, ext, c] = matches;
        if (c === '') {
            year = parseInt(year);
            year += year < 54 ? 1900 : 1800;
            return this.isDateValid(this.getMonth(month, year), day, year);
        }
        let controlEntity = (year + month + day + ext) % 11;
        if (controlEntity === 10) {
            controlEntity = 0;
        }
        if (controlEntity !== parseInt(c)) {
            return false;
        }
        year = parseInt(year);
        year += year < 54 ? 2000 : 1900;
        return this.isDateValid(this.getMonth(month, year), day, year);
    }

    function getMonth(month, year) {
        // k měsíci může být připočteno 20, 50 nebo 70
        if (month > 70 && year > 2003) {
            month -= 70;
            return month;
        }
        if (month > 50) {
            month -= 50;
            return month;
        }
        if (month > 20 && year > 2003) {
            month -= 20;
            return month;
        }
        return month;
    }

    function isDateValid(month, day, year) {
        month = parseInt(month);
        day = parseInt(day);
        year = parseInt(year);

        return (0 <= month)
            && (month <= 11)
            && (0 < year)
            && (year < 32768)
            && (0 < day)
            && (day <= (new Date(year, month, 0)).getDate())
    }
</script>
</body>
</html>
